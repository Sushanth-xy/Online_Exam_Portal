server:
  port: 8080

spring:
  application:
    name: oep-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/oep
    username: oep
    password: oep
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false
