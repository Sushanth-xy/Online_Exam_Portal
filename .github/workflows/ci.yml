name: CI Pipeline

on:
  push:
    branches: [ main, chore/initial-setup, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-test:
    name: Backend Build & Test (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x backend/mvnw

      - name: Build and Test with Maven
        run: |
          cd backend
          ./mvnw clean test

  frontend-build-lint:
    name: Frontend Lint & Build (Vite + React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Linter
        run: |
          cd frontend
          npm run lint

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
