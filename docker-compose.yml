services:
  postgres:
    image: postgres:16
    container_name: oep-postgres
    restart: always
    environment:
      POSTGRES_DB: oep
      POSTGRES_USER: oep
      POSTGRES_PASSWORD: oep
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
